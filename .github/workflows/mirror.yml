name: Mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mirror

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FEDORA_RELEASE: "45"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build and publish the Flathub and Fedora catalogs
        run: bun mirror/src/main.ts
