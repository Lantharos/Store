name: Action test

on:
  workflow_dispatch:
    inputs:
      action:
        description: Commit of the publish action to test
        required: true
      version:
        description: Version to publish
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [full, plain]
    steps:
      - uses: actions/checkout@v7
      - name: Make the files
        run: |
          mkdir dist
          printf 'app\n' > dist/action-test-linux-x86_64-deb.deb
          if [ "${{ matrix.project }}" = full ]; then
            printf 'helper\n' > dist/action-test-helper-linux-x86_64-deb.deb
            printf 'cli\n' | gzip > dist/action-test-cli-linux-x86_64.tar.gz
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.action }}
          path: action
      - uses: ./action/publish
        with:
          files: dist/**
          schelf-toml: .github/action-test/${{ matrix.project }}/schelf.toml
          version: ${{ inputs.version }}
          channel: nightly
