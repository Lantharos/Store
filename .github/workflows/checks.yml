name: Checks

on:
  repository_dispatch:
    types: [schelf-checks]

permissions:
  contents: read
  id-token: write

concurrency:
  group: checks-${{ github.event.client_payload.release }}

jobs:
  check:
    name: ${{ github.event.client_payload.app }} ${{ github.event.client_payload.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLAMAV_DATABASE: /home/runner/clamav
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install the scanners and unpackers
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            clamav yara squashfs-tools msitools p7zip-full libarchive-tools binutils-multiarch zstd rpm \
            gsettings-desktop-schemas
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CLAMAV_DATABASE }}
          key: clamav-${{ steps.day.outputs.day }}
          restore-keys: clamav-
      - name: Update virus signatures
        run: |
          sudo apparmor_parser --remove /etc/apparmor.d/usr.bin.freshclam
          mkdir -p "$CLAMAV_DATABASE"
          printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\n' "$CLAMAV_DATABASE" > "$RUNNER_TEMP/freshclam.conf"
          freshclam --quiet --config-file="$RUNNER_TEMP/freshclam.conf"
      - run: bun install --frozen-lockfile
      - name: Check the release
        run: bun checks/src/main.ts
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
