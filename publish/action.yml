name: Publish on Schelf
description: Send a release to schelf.store for review, with build provenance for every file
author: Lantharos
branding:
  icon: package
  color: yellow

inputs:
  files:
    description: Files to publish, one glob per line. Add #platform to a line to say which system its files are for, like dist/*.app.tar.gz#macos-aarch64
    required: false
  release-assets:
    description: Names of this GitHub release's assets to publish, one glob per line, for builds that attach their files to the release. Waits for them to finish uploading.
    required: false
  schelf-toml:
    description: Path to schelf.toml
    default: schelf.toml
  notes:
    description: Release notes. Defaults to the GitHub release's description when the run is for one.
    required: false
  version:
    description: The version to publish. Defaults to the release's tag when the run is for one, and otherwise to the version in the app's Sabine.toml, extension.toml, tauri.conf.json or package.json.
    required: false
  channel:
    description: The channel to release on, such as beta or nightly. Defaults to stable, or to the channel a pre-release version names, like 2.0.0-beta.1. Nightly releases get a version of their own, like 0.2.0-nightly.202611030415.g1a2b3c4, unless you pass one.
    required: false
  bridge:
    description: Publish this as the bridge, the last build in the old framework when moving to a new one
    default: "false"
  api:
    description: The store to publish to
    default: https://schelf.store
  github-token:
    description: Token that records the build provenance attestations and reads the release
    default: ${{ github.token }}

outputs:
  release:
    description: The release's id on Schelf
  status:
    description: Where the release is after upload, such as checking or failed
  url:
    description: The release in the Schelf dashboard

runs:
  using: node24
  main: dist/index.js
